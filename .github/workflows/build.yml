name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write.
permissions:
  contents: read

env:
  UPSTREAM_TAG: upstream-2.9.7
  LINUX_TAR: Celtx-2.9.7-64.tar.bz2
  WIN_PAF: CeltxPortable_2.9.7_Spanish_Development_Test_1.paf.exe

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch original Celtx 2.9.7 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$UPSTREAM_TAG" -R "$GITHUB_REPOSITORY" -D upstream
          (cd upstream && sha256sum -c ../packaging/upstream.sha256)
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full gcc
      - name: Assemble package
        run: |
          python scripts/assemble.py linux \
            --linux-tar "upstream/$LINUX_TAR" --win-paf "upstream/$WIN_PAF" \
            --out dist --version "${GITHUB_REF_NAME//\//-}" --wheels
      - name: Server selftest and layout regression tests
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r server/requirements.txt
          (cd server && /tmp/venv/bin/python launcher.py --selftest) \
            || { cat /tmp/openscript-server.log; exit 1; }
          /tmp/venv/bin/python tests/test_layout.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScript-linux
          path: dist/*.tar.gz

  appimage:
    # Ubuntu 22.04 base: the AppImage runs on distributions with glibc >= 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original Celtx 2.9.7 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$UPSTREAM_TAG" -R "$GITHUB_REPOSITORY" -D upstream
          (cd upstream && sha256sum -c ../packaging/upstream.sha256)
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils p7zip-full file gcc make libc6-dev \
            python3 python3-pip python3-venv \
            libgtk2.0-0 gnome-themes-extra libxt6 \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-liberation
          python3 -m pip install -r server/requirements.txt -r packaging/requirements-build.txt
      - name: Build AppImage
        run: |
          packaging/appimage/build-appimage.sh "upstream/$LINUX_TAR" "upstream/$WIN_PAF" \
            dist "${GITHUB_REF_NAME//\//-}"
      - name: Test the bundled server on other distributions
        run: |
          cd dist && ./*.AppImage --appimage-extract >/dev/null
          test_on() {  # image, command that installs fonts like a desktop has
            echo "== $1"
            docker run --rm -v "$PWD/squashfs-root:/app:ro" "$1" sh -c "$2 >/dev/null 2>&1;
              /app/usr/lib/openscript/server/openscript-server --selftest;
              code=\$?; tail -3 /tmp/openscript-server.log; exit \$code"
          }
          test_on fedora:latest "dnf -y -q install fontconfig liberation-mono-fonts"
          test_on opensuse/tumbleweed:latest "zypper -n -q in fontconfig liberation-fonts"
          test_on ubuntu:24.04 "apt-get update && apt-get install -y fontconfig fonts-liberation"
          test_on debian:12 "apt-get update && apt-get install -y fontconfig fonts-liberation"
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScript-appimage
          path: dist/*.AppImage

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch original Celtx 2.9.7 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:UPSTREAM_TAG -R $env:GITHUB_REPOSITORY -D upstream
          # same check as `sha256sum -c packaging/upstream.sha256`
          Get-Content packaging/upstream.sha256 | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 "upstream/$name").Hash
            if ($actual -ne $hash.ToUpper()) { throw "checksum mismatch: $name" }
            Write-Output "$name: OK"
          }
      - name: Install Pango (MSYS2) for WeasyPrint
        run: |
          C:\msys64\usr\bin\bash -lc 'pacman -S mingw-w64-ucrt-x86_64-pango --noconfirm'
          if (Test-Path C:\msys64\ucrt64\bin\python.exe) { Remove-Item C:\msys64\ucrt64\bin\python.exe }
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install Python requirements
        run: python -m pip install -r server/requirements.txt -r packaging/requirements-build.txt
      - name: Assemble app folder
        run: |
          python scripts/assemble.py windows `
            --linux-tar "upstream/$env:LINUX_TAR" --win-paf "upstream/$env:WIN_PAF" `
            --out dist
      - name: Build OpenScript.exe (launcher + local server)
        run: |
          python -m PyInstaller server/launcher.py --name OpenScript --onedir --noconsole `
            --icon assets/openscript.ico --paths server `
            --hidden-import server --hidden-import exporters `
            --distpath pyi-dist --workpath pyi-build --noconfirm
          Copy-Item -Recurse -Force pyi-dist/OpenScript/* dist/OpenScript/
      - name: Set OpenScript icon on the engine executable
        run: |
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile rcedit-x64.exe
          $want = (Select-String -Path packaging/tools.sha256 -Pattern 'rcedit-x64.exe').Line.Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 rcedit-x64.exe).Hash -ne $want.ToUpper()) { throw "rcedit checksum mismatch" }
          ./rcedit-x64.exe dist/OpenScript/app/celtx.exe --set-icon assets/openscript.ico `
            --set-version-string ProductName OpenScript --set-version-string FileDescription OpenScript
      - name: Smoke test (frozen server)
        run: |
          $p = Start-Process -FilePath dist/OpenScript/OpenScript.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\openscript-server.log" -Tail 20
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
      - name: Zip
        run: |
          $ver = "$env:GITHUB_REF_NAME".Replace("/", "-")
          Compress-Archive -Path dist/OpenScript -DestinationPath "dist/OpenScript-$ver-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScript-windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, appimage, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "OpenScript $GITHUB_REF_NAME" --generate-notes \
            out/OpenScript-appimage/*.AppImage out/OpenScript-linux/*.tar.gz \
            out/OpenScript-windows/*.zip
