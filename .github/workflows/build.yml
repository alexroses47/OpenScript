name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write.
permissions:
  contents: read

env:
  UPSTREAM_TAG: upstream-2.9.7
  LINUX_TAR: Celtx-2.9.7-64.tar.bz2
  WIN_PAF: CeltxPortable_2.9.7_Spanish_Development_Test_1.paf.exe

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch original Celtx 2.9.7 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$UPSTREAM_TAG" -R "$GITHUB_REPOSITORY" -D upstream
          (cd upstream && sha256sum -c ../packaging/upstream.sha256)
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full gcc
      - name: Assemble package
        run: |
          python scripts/assemble.py linux \
            --linux-tar "upstream/$LINUX_TAR" --win-paf "upstream/$WIN_PAF" \
            --out dist --version "${GITHUB_REF_NAME//\//-}" --wheels
      - name: Server selftest and layout regression tests
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r server/requirements.txt
          (cd server && /tmp/venv/bin/python launcher.py --selftest) \
            || { cat /tmp/openscript-server.log; exit 1; }
          /tmp/venv/bin/python tests/test_layout.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScript-linux
          path: dist/*.tar.gz

  appimage:
    # Ubuntu 22.04 base: the AppImage runs on distributions with glibc >= 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original Celtx 2.9.7 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$UPSTREAM_TAG" -R "$GITHUB_REPOSITORY" -D upstream
          (cd upstream && sha256sum -c ../packaging/upstream.sha256)
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils p7zip-full file gcc make libc6-dev \
            python3 python3-pip python3-venv \
            libgtk2.0-0 gnome-themes-extra libxt6 \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-liberation
          python3 -m pip install -r server/requirements.txt -r packaging/requirements-build.txt
      - name: Build AppImage
        run: |
          packaging/appimage/build-appimage.sh "upstream/$LINUX_TAR" "upstream/$WIN_PAF" \
            dist "${GITHUB_REF_NAME//\//-}"
      - name: Test the bundled server on other distributions
        run: |
          cd dist && ./*.AppImage --appimage-extract >/dev/null
          test_on() {  # image, command that installs fonts like a desktop has
            echo "== $1"
            docker run --rm -v "$PWD/squashfs-root:/app:ro" "$1" sh -c "$2 >/dev/null 2>&1;
              /app/usr/lib/openscript/server/openscript-server --selftest;
              code=\$?; tail -3 /tmp/openscript-server.log; exit \$code"
          }
          test_on fedora:latest "dnf -y -q install fontconfig liberation-mono-fonts"
          test_on opensuse/tumbleweed:latest "zypper -n -q in fontconfig liberation-fonts"
          test_on ubuntu:24.04 "apt-get update && apt-get install -y fontconfig fonts-liberation"
          test_on debian:12 "apt-get update && apt-get install -y fontconfig fonts-liberation"
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScript-appimage
          path: dist/*.AppImage

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch original Celtx 2.9.7 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:UPSTREAM_TAG -R $env:GITHUB_REPOSITORY -D upstream
          # same check as `sha256sum -c packaging/upstream.sha256`
          Get-Content packaging/upstream.sha256 | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 "upstream/$name").Hash
            if ($actual -ne $hash.ToUpper()) { throw "checksum mismatch: $name" }
            Write-Output "${name}: OK"
          }
      - name: Install Pango (MSYS2) for WeasyPrint
        run: |
          C:\msys64\usr\bin\bash -lc 'pacman -S mingw-w64-ucrt-x86_64-pango --noconfirm'
          if (Test-Path C:\msys64\ucrt64\bin\python.exe) { Remove-Item C:\msys64\ucrt64\bin\python.exe }
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install Python requirements
        run: python -m pip install -r server/requirements.txt -r packaging/requirements-build.txt pefile==2024.8.26
      - name: Assemble app folder
        run: |
          python scripts/assemble.py windows `
            --linux-tar "upstream/$env:LINUX_TAR" --win-paf "upstream/$env:WIN_PAF" `
            --out dist
      - name: Build OpenScript.exe (launcher + local server)
        run: |
          python -m PyInstaller server/launcher.py --name OpenScript --onedir --noconsole `
            --icon assets/openscript.ico --paths server `
            --hidden-import server --hidden-import exporters `
            --distpath pyi-dist --workpath pyi-build --noconfirm
          Copy-Item -Recurse -Force pyi-dist/OpenScript/* dist/OpenScript/
      - name: Set OpenScript icon on the engine executable
        run: |
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile rcedit-x64.exe
          $want = (Select-String -Path packaging/tools.sha256 -Pattern 'rcedit-x64.exe').Line.Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 rcedit-x64.exe).Hash -ne $want.ToUpper()) { throw "rcedit checksum mismatch" }
          ./rcedit-x64.exe dist/OpenScript/app/celtx.exe --set-icon assets/openscript.ico `
            --set-version-string ProductName OpenScript --set-version-string FileDescription OpenScript
          # rcedit only replaces one of the three icon groups; replace them all
          python packaging/windows/set_exe_icons.py dist/OpenScript/app/celtx.exe assets/openscript.ico
          if ($LASTEXITCODE -ne 0) { throw "icon replacement failed" }
      - name: Smoke test (frozen server)
        run: |
          $p = Start-Process -FilePath dist/OpenScript/OpenScript.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\openscript-server.log" -Tail 20
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
      - name: Zip
        run: |
          $ver = "$env:GITHUB_REF_NAME".Replace("/", "-")
          Compress-Archive -Path dist/OpenScript -DestinationPath "dist/OpenScript-$ver-windows.zip"
      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $ver = "$env:GITHUB_REF_NAME".Replace("/", "-")
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\dist\OpenScript" "/DOutputDir=$PWD\dist" `
            packaging\windows\openscript.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - name: Test the installer (silent install, selftest, uninstall)
        run: |
          $setup = Get-ChildItem dist/*-windows-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\OpenScriptTest"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/TASKS=associate" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup failed ($($p.ExitCode))" }
          $p = Start-Process "$dir\OpenScript.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed selftest failed ($($p.ExitCode))" }
          if (-not (Test-Path "HKCU:\Software\Classes\.celtx")) { throw ".celtx association missing" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\OpenScript.exe") { throw "uninstall left files behind" }
          Write-Output "installer OK"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScript-windows
          path: |
            dist/*.zip
            dist/*-windows-setup.exe

  macos:
    # Intel runner: Wine is x86_64 anyway, so an x86_64 server makes a single
    # .app for Intel Macs and (through Rosetta 2) Apple Silicon. The engine is
    # the finished Windows build (checksum-verified upstream, icons applied).
    needs: windows
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows build of the engine (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: OpenScript-windows
          path: winzip
      - name: Unpack it
        run: |
          mkdir win && ditto -x -k winzip/*-windows.zip win
          ls win/OpenScript/app/celtx.exe
      - name: Install Pango (Homebrew)
        run: brew install pango
      - name: Install Python requirements
        run: python -m pip install -r server/requirements.txt -r packaging/requirements-build.txt
      - name: Freeze the server with its Pango libraries
        run: |
          LIB="$(brew --prefix)/lib"
          BIN=()
          for l in libgobject-2.0.0.dylib libglib-2.0.0.dylib libpango-1.0.0.dylib \
                   libpangoft2-1.0.0.dylib libharfbuzz.0.dylib libharfbuzz-subset.0.dylib \
                   libfontconfig.1.dylib libfreetype.6.dylib; do
            BIN+=(--add-binary "$LIB/$l:.")
          done
          python -m PyInstaller server/launcher.py --name openscript-server --onedir \
            --paths server --hidden-import server --hidden-import exporters "${BIN[@]}" \
            --distpath pyi-dist --workpath pyi-build --noconfirm --log-level WARN
      - name: Selftest the frozen server without Homebrew
        run: |
          # hide Homebrew so only the bundled libraries can be used
          sudo mv "$(brew --prefix)/Cellar" "$(brew --prefix)/Cellar.off"
          FONTCONFIG_FILE="$PWD/packaging/macos/fonts.conf" pyi-dist/openscript-server/openscript-server --selftest \
            || { cat "$TMPDIR/openscript-server.log"; status=1; }
          sudo mv "$(brew --prefix)/Cellar.off" "$(brew --prefix)/Cellar"
          tail -2 "$TMPDIR/openscript-server.log"
          exit ${status:-0}
      - name: Fetch Wine for macOS (pinned, checksum-verified)
        run: |
          curl -fsSL -o wine-staging-11.21-osx64.tar.xz \
            https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-staging-11.21-osx64.tar.xz
          grep ' wine-staging-11.21-osx64.tar.xz$' packaging/tools.sha256 | shasum -a 256 -c -
      - name: Build OpenScript.app and the disk image
        run: |
          packaging/macos/build-macos.sh win/OpenScript wine-staging-11.21-osx64.tar.xz \
            pyi-dist/openscript-server dist "${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScript-macos
          path: dist/*.dmg

  macos-test:
    # Apple Silicon: the app's x86_64 parts run through Rosetta 2
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenScript-macos
          path: dmg
      - name: Rosetta 2
        run: |
          /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license
          /usr/bin/arch -x86_64 /usr/bin/true && echo "Rosetta OK"
      - name: Install from the disk image
        run: |
          hdiutil attach dmg/*.dmg -mountpoint /Volumes/OpenScript -nobrowse
          cp -R /Volumes/OpenScript/OpenScript.app "$RUNNER_TEMP/"
          for i in 1 2 3 4 5; do hdiutil detach /Volumes/OpenScript && break || sleep 3; done
          [ ! -d /Volumes/OpenScript ] || hdiutil detach -force /Volumes/OpenScript
          codesign --verify --deep --strict "$RUNNER_TEMP/OpenScript.app"
      - name: Selftest the bundled server (Rosetta, no Homebrew x86_64 libraries)
        run: |
          R="$RUNNER_TEMP/OpenScript.app/Contents/Resources"
          FONTCONFIG_FILE="$R/server/fonts.conf" "$R/server/openscript-server" --selftest \
            || { cat "$TMPDIR/openscript-server.log"; exit 1; }
          grep "SELFTEST OK" "$TMPDIR/openscript-server.log"
      - name: Smoke test (start the app, check Wine and the server)
        run: |
          SUPPORT="$HOME/Library/Application Support/OpenScript"
          "$RUNNER_TEMP/OpenScript.app/Contents/MacOS/OpenScript" &
          for i in $(seq 1 60); do
            pgrep -f 'app/celtx.exe' >/dev/null && break
            sleep 5
          done
          sleep 30
          screencapture -x "$RUNNER_TEMP/openscript-macos.png" || true
          echo "--- launcher log"; cat "$SUPPORT/openscript.log" || true
          echo "--- display settings (RetinaMode, Windows DPI): $(cat "$SUPPORT/display" 2>/dev/null)"
          pgrep -fl 'celtx.exe' || { echo "engine is not running"; exit 1; }
          TOKEN=$(cat "$SUPPORT/token")
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:47890/?token=$TOKEN")
          echo "server answered: $code"
          [ "$code" = 200 ]
          "$RUNNER_TEMP/OpenScript.app/Contents/Resources/wine/bin/wineserver" -k || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke-test-screenshot
          path: ${{ runner.temp }}/openscript-macos.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, appimage, windows, macos, macos-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "OpenScript $GITHUB_REF_NAME" --generate-notes \
            out/OpenScript-appimage/*.AppImage out/OpenScript-linux/*.tar.gz \
            out/OpenScript-windows/*-windows-setup.exe out/OpenScript-windows/*.zip \\
            out/OpenScript-macos/*.dmg
