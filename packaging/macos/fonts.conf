<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- OpenScript (macOS): fontconfig setup for the bundled PDF server.
     The fontconfig library comes from Homebrew and would otherwise look for
     its configuration in Homebrew's folder, which users do not have. -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/OpenScript/fontconfig</cachedir>
  <!-- generic families used by the stylesheets as a last resort -->
  <alias><family>monospace</family><prefer><family>Courier New</family><family>Menlo</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Times New Roman</family><family>Times</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Helvetica</family><family>Arial</family></prefer></alias>
</fontconfig>
